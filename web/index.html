<!DOCTYPE html>
<html lang="th">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Mobile viewport — required so the app renders correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Daisenko Hero Service — ระบบงานช่างเทคนิค">
  <meta name="theme-color" content="#1E3A8A">

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daisenko Hero">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Daisenko Hero Service</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; }
    /* หน้าโหลดแบรนด์ — แสดงจนกว่า Flutter จะวาดหน้าจอแรก
       (แทนหน้าจอขาวว่างบนมือถือที่เน็ตช้า) */
    #app-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: linear-gradient(135deg, #1E3A8A 0%, #2f6bd6 60%, #0EA5E9 130%);
      color: #fff; font-family: system-ui, -apple-system, "Noto Sans Thai", "Segoe UI", sans-serif;
    }
    #app-splash .ring {
      width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%; animation: dhs-spin 1s linear infinite;
    }
    #app-splash .brand { font-size: 20px; font-weight: 800; letter-spacing: .18em; }
    #app-splash .txt { font-size: 14px; opacity: .9; letter-spacing: .02em; }
    @keyframes dhs-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-splash">
    <div class="brand">DAISENKO</div>
    <div class="ring"></div>
    <div class="txt">กำลังโหลด… กรุณารอสักครู่</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // ซ่อนหน้าโหลดเมื่อ Flutter เริ่มแสดงผล
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('app-splash');
      if (s) { s.style.transition = 'opacity .3s'; s.style.opacity = '0'; setTimeout(function(){ s.remove(); }, 300); }
    });
  </script>
</body>
</html>
